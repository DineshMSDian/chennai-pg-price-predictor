services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chennai-pg-api
    ports:
      - "8000:8000"
    env_file:
      - .env

  web:
    build: 
      context: .
      dockerfile: Dockerfile.web
    container_name: chennai-pg-web
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - api